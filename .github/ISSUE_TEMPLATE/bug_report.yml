name: Bug report
description: Report a problem with Background Cover
title: '[Bug] '
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a problem.

              The single most useful thing you can attach is the **developer console output**. Most issues with this plugin depend on your theme, your version and your window mode, and the console usually names the cause.

    - type: textarea
      id: console-log
      attributes:
          label: Console output
          description: |
              In the app, open **Help → Toggle developer tools → Console**, reproduce the problem, and paste anything in red here. If nothing is logged, say so — "no errors" is useful information too.
          render: text
          placeholder: |
              Uncaught TypeError: ...
      validations:
          required: false

    - type: textarea
      id: settings
      attributes:
          label: Background Cover settings
          description: |
              Paste the relevant settings from **Settings → Background Cover** (folders, size mode, blend mode, opacity, aspect ratio filter and threshold). If the problem involves a specific image, say whether it is portrait or landscape — and, if you have run a **Scan**, the numbers it reports.
      validations:
          required: false

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Describe the problem, and what you expected to happen instead.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: How can the problem be triggered reliably?
          placeholder: |
              1. Set the background folder to ...
              2. Enable ...
              3. ...
      validations:
          required: true

    - type: input
      id: obsidian-version
      attributes:
          label: Obsidian version
          description: Found in **Settings → General → Current version**.
          placeholder: '1.13.0'
      validations:
          required: true

    - type: input
      id: plugin-version
      attributes:
          label: Background Cover version
          description: Found in **Settings → Community plugins**.
          placeholder: '1.2.0'
      validations:
          required: true

    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - macOS
              - Linux
      validations:
          required: true

    - type: input
      id: theme
      attributes:
          label: Theme
          description: Which theme are you using? If the problem only appears with a specific theme, say so — it usually matters.
          placeholder: Default, Minimal, Royal Velvet, ...
      validations:
          required: false

    - type: dropdown
      id: theme-transparency
      attributes:
          label: Is "Make theme background transparent" enabled?
          description: Found under **Settings → Background Cover → Theme integration**. This setting overrides theme colors and changes how the wallpaper is composited.
          options:
              - 'No'
              - 'Yes'
              - Not sure
      validations:
          required: true

    - type: dropdown
      id: window-mode
      attributes:
          label: Window mode
          description: The frameless window setting affects the title bar, which changes whether the wallpaper shows behind it.
          options:
              - Frameless window (default on Windows and Linux)
              - Native window frame
              - Not sure
      validations:
          required: false

    - type: checkboxes
      id: checks
      attributes:
          label: Before submitting
          options:
              - label: I am running the latest release of Background Cover.
                required: true
              - label: I searched the existing issues and this has not been reported yet.
                required: true
              - label: I have pasted the console output above, or confirmed that nothing is logged.
                required: true
