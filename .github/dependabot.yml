# Dependabot configuration.
#
# Automatic version updates are turned OFF: `open-pull-requests-limit` is 0 for both
# ecosystems, so Dependabot no longer analyses dependencies or opens pull requests on
# its own. See the option reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Dependency upgrades are now handled by hand — check the upstream release notes first,
# and coordinate ESLint major versions with the `eslint-plugin-obsidianmd` peer ranges.
# To bring automatic updates back, set `open-pull-requests-limit` to 5 again (or delete
# the line) in the ecosystem you want re-enabled.
#
# Why it used to be on: the community directory review includes a "Dependencies" check
# that fails when a dependency has a known vulnerability, so keeping dependencies
# current is not just hygiene here — it is part of staying listed. See CONTRIBUTING.md.
# With automatic updates off, that check is covered by the manual pass before a release.
# Note that Dependabot alerts and security updates are separate repository settings and
# are off in this repository as well.
#
# Note: `obsidian` is pinned to "latest" in devDependencies. Dependabot may skip an
# unversioned range or behave unpredictably on it, and this package also drives the
# declarative-settings API availability — so bump it deliberately, by hand.

version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 0 # 0 = automatic version updates disabled
      commit-message:
          prefix: 'chore(deps)'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 0 # 0 = automatic version updates disabled
      commit-message:
          prefix: 'chore(ci)'
